name: Bug report
description: Something in Tacet does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Tacet version
      description: From Help, About.
    validations: {required: true}
  - type: input
    id: os
    attributes:
      label: Operating system and build
      placeholder: Windows 11 23H2, or macOS 15
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations: {required: true}
  - type: dropdown
    id: profile
    attributes:
      label: Does it happen with a new profile?
      options: [Yes, No, Not tried]
    validations: {required: true}
