<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Margin app icon: a white page with one blue margin rule</title>
  <defs>
    <!-- Page material: near-flat white with a barely perceptible falloff (Fluent app-icon material, not a UI gradient). -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F6F9"/>
    </linearGradient>
    <!-- Contact shadow: short, neutral, low opacity; sits under the page only. -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.9"/>
      <feOffset dy="0.9"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="page"><rect x="9" y="3" width="30" height="42" rx="2.5"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="9" y="3" width="30" height="42" rx="2.5" fill="url(#paper)"/>
  </g>
  <!-- The margin rule: inset 7 units (22% of page width), full page height, clipped to the page. -->
  <rect x="15.25" y="3" width="1.5" height="42" fill="#2167D5" clip-path="url(#page)"/>
  <!-- Edge: inside hairline so the page holds on a white taskbar and Start menu. -->
  <rect x="9.25" y="3.25" width="29.5" height="41.5" rx="2.25" fill="none" stroke="#22252B" stroke-opacity="0.16" stroke-width="0.5"/>
</svg>
