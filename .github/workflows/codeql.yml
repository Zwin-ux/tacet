name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - '**/test/**'
              - '**/fixtures/**'
              - 'extensions/**/media/**'
              - 'src/vs/base/test/**'
              - 'test/**'
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
